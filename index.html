<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grandview Walkthrough</title>
<meta name="theme-color" content="#f2f3f7">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="Walkthrough">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
:root{
 --accent:#2f6db5;--accent-d:#1f3557;--accent-soft:#e8f0fa;
 --bg:#f2f3f7;--card:#fff;--fill:#f2f3f7;--ink:#1c1c1e;--sub:#6e6e73;--faint:#aeaeb2;--sep:#e5e5ea;
 --danger:#d93025;--ok:#34a853;--r:18px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
button,input,textarea,label,a,.chip,.pill{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;overflow-x:hidden;max-width:100vw;overscroll-behavior-x:none;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:var(--ink)}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));
 background:rgba(242,243,247,.82);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
.top img{height:30px;flex:none}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:5px}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;transition:transform .3s}
.saved.pulse i{transform:scale(1.6)}
.saved.off i{background:#f4b400}
.more{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:20px;letter-spacing:1px;color:var(--accent-d);display:grid;place-items:center}

main{max-width:760px;margin:0 auto;padding:6px calc(16px + env(safe-area-inset-right)) calc(150px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(20,30,60,.05);margin:0 0 16px;scroll-margin-top:70px;overflow:hidden}
.card.enter{animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}}
.cpad{padding:18px 18px 20px}
.ctitle{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.csub{font-size:14px;color:var(--sub);margin-top:2px}
.grp{padding:16px 18px;border-top:1px solid var(--sep)}
.grp:first-of-type{border-top:0}
h4{margin:0 0 10px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sub)}
h4 span{text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint);margin-left:6px}

/* fields */
.field{width:100%;min-width:0;max-width:100%;border:0;background:var(--fill);border-radius:12px;padding:12px 14px;min-height:48px;font-size:17px;outline:none;transition:box-shadow .15s,background .15s;-webkit-appearance:none;appearance:none}
.field:focus{background:#fff;box-shadow:0 0 0 2px var(--accent)}
.field::placeholder,textarea::placeholder{color:var(--faint)}
input[type=date].field{display:block;-webkit-appearance:none;line-height:24px}
textarea.field{resize:none;min-height:48px;line-height:1.4;display:block;overflow:hidden}
.flabel{display:block;font-size:13px;color:var(--sub);margin:0 0 6px 2px}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fgrid>*{min-width:0}
.fgrid .full{grid-column:1/-1}
.stack>*+*{margin-top:10px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.jcard{background:var(--fill);border-radius:16px;padding:14px 16px}.jcard .addrpick{background:#fff;color:#2563c9;font-weight:600}.jaddr{font-size:24px;font-weight:700;line-height:1.2}.jline{font-size:17px;margin-top:4px}.jline a{color:#2563c9;text-decoration:none;display:inline-block;min-height:44px;line-height:44px}.jline.dim{opacity:.65;font-size:15px}
.jpick{display:block}.jopt{display:block;width:100%;text-align:left;min-height:56px;padding:10px 14px;margin:6px 0;border-radius:14px;background:var(--fill);color:var(--ink)}.jopt b{display:block;font-size:17px}.jopt small{opacity:.65;font-size:14px}
.addrpick{margin:8px 8px 0 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{min-height:44px;padding:0 16px;border-radius:999px;background:var(--fill);font-size:16px;font-weight:500;color:var(--ink);transition:background .15s,color .15s,transform .1s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);color:#fff}
.chip.sm{min-height:44px;padding:0 13px;font-size:15px}
.chip.add{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.other{background:#fff;border:2px dashed var(--accent);color:var(--accent);font-weight:600}
.chip.other.on{background:var(--accent-soft);color:var(--accent);border-style:solid}
.cother{display:flex;gap:10px;margin-top:14px;align-items:stretch}.cother[hidden]{display:none}
.cother .field{flex:1 1 auto;min-width:0;font-size:17px}.cother .btn{flex:0 0 auto;min-width:76px}
.cother.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:44px;border-radius:9px;font-size:16px;font-weight:500;color:var(--sub);transition:background .2s,color .2s,box-shadow .2s}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* size */
.dims{display:flex;align-items:flex-end;gap:8px}
.dims label{flex:1;min-width:0}
.dims .x{color:var(--faint);font-size:20px;padding-bottom:12px}
.dims .field{text-align:center;font-size:22px;font-weight:600;min-height:56px}
.derived{font-size:14px;color:var(--sub);margin-top:10px;min-height:0}
.derived:empty{display:none}
.linkbtn{color:var(--accent);font-size:16px;font-weight:500;min-height:44px;margin-top:6px}
.segrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.segrow .field{text-align:center}
.segrow.ot .field{text-align:left;min-width:0;flex:1}.segrow.ot .stepper{flex:none}
.segrow .x{color:var(--faint)}
.segrow .rm{width:44px;height:44px;border-radius:50%;background:var(--fill);color:var(--sub);flex:none}

/* list rows with steppers */
.list{background:var(--fill);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding:6px 8px 6px 14px}
.row+.row{border-top:1px solid #e3e4ea}
.row .rl{font-size:16px}
.stepper{display:flex;align-items:center;background:#fff;border-radius:11px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stepper button{width:44px;height:44px;font-size:22px;font-weight:500;color:var(--accent);line-height:1}
.stepper button:active{background:var(--accent-soft)}
.stepper input{width:48px;height:44px;border:0;text-align:center;font-size:17px;font-weight:600;background:transparent;outline:none}
.stepper input:focus{background:var(--accent-soft)}

/* disclosure + reveal */
.reveal{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .28s var(--ease),opacity .2s,margin .28s var(--ease)}
.reveal>div{overflow:hidden;min-height:0}
.reveal.open{grid-template-rows:1fr;opacity:1;margin-top:12px}
.subl{font-size:13px;color:var(--sub);margin:0 0 8px 2px}
.pss{margin-top:14px;padding:14px;border-radius:16px;background:#f7f8fb;border:1px solid #e6e8ee}
.pss .pshead{font-size:15px;font-weight:700;margin:0 0 10px}
.pss .pshint{font-size:13px;color:var(--sub);margin:8px 2px 0}
.pss .field{background:#fff}
.pss .chips{margin-top:6px}
.pick{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}.pglab{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;opacity:.55;margin:8px 0 2px}.pgrp .pglab{margin-top:4px}.pick .chip{white-space:normal;text-align:left}.pother{margin-top:4px}.psrbody{flex-basis:100%;min-width:0}
.pss .switchrow{margin-top:12px;gap:10px}.pss .switchrow .dl{font-size:16px}
.pslist{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.psrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,138px);grid-template-areas:'l l' 'p s';gap:6px 8px}
.psrow .psl{grid-area:l;font-size:14px;font-weight:600;margin:0 0 0 2px;display:flex;gap:8px;align-items:baseline;align-self:center}
.psrow input{grid-area:p}.psrow select{grid-area:s}
.psrow .psl small{font-weight:400;color:var(--sub);font-size:13px}
select.field{padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,#8a8f99 50%),linear-gradient(135deg,#8a8f99 50%,transparent 50%);background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;background-size:5px 5px;background-repeat:no-repeat;color:var(--ink)}
.psrow.ov .psl{color:var(--accent)}
@media (max-width:600px){ .psrow{grid-template-columns:minmax(0,1fr) minmax(0,150px);grid-template-areas:'l s' 'p p'} }
.disc{display:flex;align-items:center;width:100%;gap:10px;min-height:52px;margin-top:12px;padding:0 14px;border-radius:14px;background:var(--fill);text-align:left}
.disc .dl{flex:1;font-size:16px;font-weight:500}
.disc .ds{font-size:14px;color:var(--sub);max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--faint);font-size:20px;transition:transform .25s var(--ease);display:inline-block}
.disc.on .chev{transform:rotate(90deg)}
.switchrow{display:flex;align-items:center;width:100%;min-height:44px;text-align:left}
.switchrow .dl{flex:1;font-size:17px;font-weight:600}
.sw{width:51px;height:31px;border-radius:999px;background:#e3e4e8;position:relative;transition:background .2s;flex:none}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.switchrow.on .sw{background:var(--ok)}
.switchrow.on .sw:after{transform:translateX(20px)}

/* room card */
.rhead{display:flex;align-items:center;gap:12px;padding:16px 14px 6px 18px}
.badge{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.rtitle{flex:1;min-width:0;border:0;background:transparent;font-size:24px;font-weight:700;letter-spacing:-.01em;outline:none;padding:4px 0}
.rtitle::placeholder{color:var(--faint)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--fill);color:var(--sub);font-size:18px;flex:none}
.rfoot{display:flex;gap:10px;padding:14px 18px 18px;border-top:1px solid var(--sep)}
.btn{min-height:48px;padding:0 18px;border-radius:14px;font-size:16px;font-weight:600;background:var(--fill);color:var(--accent-d)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.grow{flex:1}
/* summary (collapsed) card */
.mini{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px 14px 18px;text-align:left;min-height:72px}
.mini .mt{flex:1;min-width:0}
.mini b{display:block;font-size:18px;font-weight:600}
.mini small{display:block;font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge.dim{background:var(--accent-soft);color:var(--accent)}

/* empty state */
.empty{text-align:center;padding:26px 18px}
.empty p{color:var(--sub);margin:4px 0 16px}

/* extras */
.xrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xrow+.xrow{margin-top:10px;padding-top:10px;border-top:1px solid var(--sep)}
.xrow .item{flex:1 1 220px}
.xrow .price{flex:0 0 120px;position:relative}
.xrow .price span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub)}
.xrow .price .field{padding-left:26px}
.xrow .rm{width:44px;height:44px;border-radius:50%;background:var(--fill);color:var(--sub);flex:none}

/* review */
.rv{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.rv+.rv{border-top:1px solid var(--sep)}
.rv .mt{flex:1;min-width:0}.rv b{font-weight:600}.rv small{display:block;color:var(--sub);font-size:14px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.tot{background:var(--fill);border-radius:14px;padding:12px 14px}
.tot b{display:block;font-size:22px;font-weight:700}.tot span{font-size:13px;color:var(--sub)}
.actions{display:flex;gap:10px;flex-wrap:wrap}.actions .btn{flex:1 1 140px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px calc(16px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));transition:transform .25s var(--ease),opacity .2s;
 background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid rgba(0,0,0,.06)}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.switcher{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.switcher::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:44px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.pill.on{background:var(--accent-d);color:#fff}
.addbtn{flex:none;min-height:48px;padding:0 20px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;box-shadow:0 4px 12px rgba(47,109,181,.35)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:51;width:min(560px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;
 padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,105%);visibility:hidden;transition:transform .32s var(--ease),visibility 0s .32s}
.sheet.show{transform:translate(-50%,0);visibility:visible;transition:transform .32s var(--ease)}
.grab{width:38px;height:5px;border-radius:3px;background:#d1d1d6;margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:20px}
.menuitem{display:flex;align-items:center;width:100%;min-height:54px;padding:0 4px;font-size:17px;text-align:left;border-bottom:1px solid var(--sep)}
.menuitem:last-child{border-bottom:0}.menuitem small{margin-left:auto;color:var(--faint);font-size:14px}
.wt{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--sep)}
.wt .mt{flex:1;min-width:0}.wt b{display:block}.wt small{color:var(--sub);font-size:14px}
.wt.cur b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:60;background:rgba(28,28,30,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;max-width:90vw;transition:opacity .2s,transform .25s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:700px){ main{padding-top:12px} .fgrid.wide{grid-template-columns:repeat(4,minmax(0,1fr))} .fgrid.wide .half{grid-column:span 2} .sheet{bottom:auto;top:50%;border-radius:22px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .28s var(--ease),opacity .2s,visibility 0s .28s}.sheet.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto;visibility:visible;transition:transform .28s var(--ease),opacity .2s}.grab{display:none}}
@media (max-width:420px){ .cpad,.grp{padding-left:16px;padding-right:16px} .addbtn{padding:0 16px} .rtitle{font-size:22px}}
/* keyboard up: get the bottom bar out of the way */
body.kb .bar{transform:translateY(110%);opacity:0;pointer-events:none}
body.kb .toast{display:none}
/* general notes */
.gnotes{min-height:180px!important;font-size:17px;line-height:1.5}
.gtags{margin-top:14px}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-d);border-radius:16px;padding:14px 14px 14px 16px;margin:0 0 16px;font-size:15px}
.tip b{display:block;font-size:16px;margin-bottom:2px}
.tip .iconbtn{background:#fff}
.share{display:inline-block;width:18px;height:18px;vertical-align:-3px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal!important}
/* iPad: use the width */
@media (min-width:1000px){
 main,.bar .in{max-width:980px}
 .rbody{display:grid;grid-template-columns:1fr 1fr}
 .rbody>.grp{border-top:1px solid var(--sep)}
 .rbody>.grp:first-child{border-top:0}
 .rbody>.grp.full{grid-column:1/-1}
 .rbody>.grp.l{border-right:1px solid var(--sep)}
 .gfields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
}
@media (max-width:380px){ .chip{padding:0 13px;font-size:15px} .addbtn{padding:0 14px;font-size:15px} .dims .field{font-size:20px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- print: paper-like copy of the GoodNotes sheet ---------- */
#print{display:none}
@media print{
 @page{size:letter;margin:.45in}
 body{background:#fff}
 .top,main,.bar,.scrim,.sheet,.toast{display:none!important}
 #print{display:block;font:12px/1.45 -apple-system,Helvetica,Arial,sans-serif;color:#111}
 .pg{break-after:page}.pg:last-child{break-after:auto}
 .ph{display:flex;align-items:flex-start;gap:16px}.ph img{height:52px}
 .pc{flex:1;font-weight:700}
 .ptitle{font-size:20px;color:#2f5f9e;font-weight:700;margin:4px 0 10px}
 .pr{display:flex;gap:18px;margin:6px 0;color:#2f5f9e;font-weight:700}
 .pr.b{color:#111}
 .u{display:inline-block;min-width:70px;border-bottom:1px solid #444;padding:0 4px;color:#111;font-weight:400}
 .p3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:14px;margin-top:14px}
 .p2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;padding-top:10px;border-top:1px solid #999}
 .ps{color:#2f5f9e;font-size:14px;margin-bottom:4px}
 .pl{margin:2px 0}
 .c{display:inline-block;padding:0 5px;border:1.5px solid transparent;border-radius:999px}
 .c.on{border-color:#d93025;font-weight:700}
 .pnote{white-space:pre-wrap;border:1px solid #ccc;border-radius:6px;padding:4px 6px;min-height:34px}
 table.pt{border-collapse:collapse;width:100%;margin-top:6px}table.pt td,table.pt th{border-bottom:1px solid #ddd;padding:3px 4px;text-align:left}
}
.psrow{display:block!important}.psrow .psl{margin-bottom:2px}.psrow input{grid-area:auto}
</style>
</head>

<script>
'use strict';
/* ---------- storage & data model (unchanged from v1) ---------- */
const K_INDEX='gv.wt.index', K_PRE='gv.wt.doc.', K_CUR='gv.wt.current';
const SCHEMA='grandview.walkthrough.interior.v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const $=s=>document.querySelector(s);

const LINE=[['doors','Doors'],['windows','Windows'],['garageDoors','Garage doors'],['fixtures','Fixtures'],['otherLnft','Other (ln ft)']];
const CIRCLE=[['fireplace','Fireplace'],['cabinetsCountertop','Cabinets/Countertop'],['sinkShower','Sink/Shower'],['stairs','Stairs'],['accentWall','Accent Wall'],['caulkTrim','Caulk Trim'],['moveFurniture','Move Furniture']];
const WALL_TEX=['Smooth','Textured','Plaster','Brick'], CEIL_TEX=['Smooth','Textured','Plaster','Popcorn'];
const PAINT=[['baseboards','Baseboards'],['crown','Crown Moulding'],['stairs','Stairs'],['fireplace','Fireplace'],['shelving','Shelving'],['closets','Closets']];
const COUNTS=[['windowTrim','Window trim'],['windowFrame','Window frame'],['doorTrim','Door trim'],['doorFrame','Door frame'],['doors','Doors'],['garageDoors','Garage doors'],['railingLnft','Railing (ln ft)'],['spindles','Spindles']];
const CAB=[['doors','Doors'],['drawers','Drawers'],['boxFlats','Box flats']];
const SHEENS=['Flat','Matte','Eggshell','Satin','Semi-Gloss','Gloss'];
const PROD_GROUPS=[[null,['Duration Interior']],['Upgrade',['Pre-Cat Epoxy','Scuff Tough','Emerald']],['Budget',['Super Paint']]];
const PROD_OPTS=PROD_GROUPS.flatMap(g=>g[1]);
const DEF_PRODUCT='Duration Interior',DEF_SHEEN='Satin';
function mapProd(t){t=(t||'').trim();if(!t)return '';const ex=PROD_OPTS.find(o=>o.toLowerCase()===t.toLowerCase());if(ex)return ex;
 const l=t.toLowerCase().replace(/[^a-z]/g,'');
 if(l.includes('duration')||l.includes('standard'))return 'Duration Interior';
 if(l.includes('precat')||l.includes('epoxy'))return 'Pre-Cat Epoxy';
 if(l.includes('scufftough'))return 'Scuff Tough';
 if(l.includes('superpaint'))return 'Super Paint';
 if(l.includes('emerald')&&!l.includes('urethane'))return 'Emerald';
 return t}
function mapSheen(t){t=(t||'').trim();if(!t)return '';const l=t.toLowerCase().replace(/[^a-z]/g,'');return SHEENS.find(x=>x.toLowerCase().replace(/[^a-z]/g,'')===l)||t}
function sheenIn(t){const l=(t||'').toLowerCase().replace(/semi[\s-]?gloss/,'semigloss');return ['semigloss','eggshell','satin','matte','flat','gloss'].map(w=>l.includes(w)&&w).find(Boolean)}
const PRODUCTS=['SW Duration','SW Emerald','SW SuperPaint','SW ProMar 200','SW Emerald Urethane Trim Enamel','SW Ceiling Bright White (flat ceiling paint)','SW Cashmere','SW Captivate','BM Regal Select','BM Advance','BM Aura','BM Ben','BM Waterborne Ceiling Paint'];
// Surfaces that can carry their own product/sheen. A surface only appears when the room has it selected/counted.
const SURFACES=[
 ['walls','Walls',r=>r.painting.walls],['ceilings','Ceilings',r=>r.painting.ceilings],
 ['baseboards','Baseboards',r=>r.painting.baseboards],['crown','Crown moulding',r=>r.painting.crown],
 ['windowTrim','Window trim',r=>filled(r.counts.windowTrim)],['windowFrame','Window frames',r=>filled(r.counts.windowFrame)],
 ['doorTrim','Door trim',r=>filled(r.counts.doorTrim)],['doorFrame','Door frames',r=>filled(r.counts.doorFrame)],['doors','Doors',r=>filled(r.counts.doors)],['garageDoors','Garage doors',r=>filled(r.counts.garageDoors)],
 ['stairs','Stairs',r=>r.painting.stairs],['railing','Railing',r=>filled(r.counts.railingLnft)],['spindles','Spindles',r=>filled(r.counts.spindles)],
 ['fireplace','Fireplace',r=>r.painting.fireplace],['shelving','Shelving',r=>r.painting.shelving],['closets','Closets',r=>r.painting.closets],
 ['cabinets','Cabinets',r=>r.ui.cabinets||CAB.some(([k])=>filled(r.cabinets[k]))]];
const GTAGS=['Customer noticed issues','Pets','Occupied home','Tight deadline','Furniture help needed'];
const SUGGEST=['Kitchen','Living Room','Bedroom','Bathroom','Hallway','Stairwell','Dining','Office','Laundry','Closet'];

function blankRoom(name=''){
 const o=a=>Object.fromEntries(a.map(([k])=>[k,'']));
 return {id:uid(),name,colorMode:'',color:'',length:'',width:'',height:'',
  walls:[{length:'',height:''}],lineCutting:o(LINE),
  circle:Object.fromEntries(CIRCLE.map(([k])=>[k,false])),patching:'',
  painting:Object.assign({walls:false,wallsTexture:[],ceilings:false,ceilingsTexture:[],otherTrim:false},Object.fromEntries(PAINT.map(([k])=>[k,false]))),otherTrim:[],
  counts:o(COUNTS),cabinets:o(CAB),notes:'',outOfOrdinary:'',collapsed:false,
  productSheen:{default:{product:'',sheen:''},bySurface:{}},
  ui:{altWalls:false,trim:false,cabinets:false,psEach:false}};
}
function blankWalkthrough(){
 return {schema:SCHEMA,id:uid(),created:Date.now(),updated:Date.now(),uploadedAt:null,jobCollapsed:false,
  job:{address:'',name:'',phone:'',estimate:'',when:'',source:'manual',date:today(),schedule:'',product:DEF_PRODUCT,sheen:DEF_SHEEN,removesArt:'',movesFurniture:'',notes:''},
  general:{notes:'',dueDate:'',colors:'',tags:[]},generalCollapsed:false,
  rooms:[],extras:[]};
}
const filled=v=>v!==''&&v!=null&&v!==0;
function migrate(d){
 d.job=d.job||{};
 if(d.job.sheen==null){const w=sheenIn(d.job.product);d.job.sheen=w?mapSheen(w):''}
 d.job.sheen=mapSheen(d.job.sheen); d.job.product=mapProd(d.job.product); if(d.job.estimate==null)d.job.estimate='';
 if(d.job.address==null)d.job.address='';
 if(d.job.customer||d.job.email){d.legacyContact=Object.assign({},d.legacyContact,{customer:d.job.customer||'',phone:d.job.phone||'',email:d.job.email||''})}
 if(d.job.name==null)d.job.name=(d.legacyContact&&d.legacyContact.customer)||'';
 if(d.job.phone==null)d.job.phone=(d.legacyContact&&d.legacyContact.phone)||'';
 for(const k of ['when']) if(d.job[k]==null)d.job[k]='';
 if(!d.job.source)d.job.source='manual';
 for(const k of ['customer','email'])delete d.job[k];
 const b=blankRoom();
 d.rooms=(d.rooms||[]).map(r=>{const n=Object.assign(blankRoom(),r);
  for(const k of ['lineCutting','circle','painting','counts','cabinets','ui'])n[k]=Object.assign({},b[k],r[k]||{});
  if(!r.ui){n.ui.trim=COUNTS.some(([k])=>filled(n.counts[k]));n.ui.cabinets=CAB.some(([k])=>filled(n.cabinets[k]));n.ui.altWalls=n.walls.some(w=>filled(w.length)||filled(w.height))}
  if(!Array.isArray(n.otherTrim))n.otherTrim=[];
  if(!Array.isArray(n.walls)||!n.walls.length)n.walls=[{length:'',height:''}];
  // v5: per-room / per-surface product & sheen
  const ps=r.productSheen||{};
  n.productSheen={default:Object.assign({product:'',sheen:''},ps.default||{}),bySurface:Object.assign({},ps.bySurface||{})};
  n.productSheen.default.product=mapProd(n.productSheen.default.product);n.productSheen.default.sheen=mapSheen(n.productSheen.default.sheen);
  for(const k in n.productSheen.bySurface){const o=n.productSheen.bySurface[k]||{};n.productSheen.bySurface[k]={product:mapProd(o.product),sheen:mapSheen(o.sheen)}}
  if(!r.ui||r.ui.psEach==null) n.ui.psEach=hasOverrides(n);
  return n});
 d.job=Object.assign(blankWalkthrough().job,d.job||{}); d.extras=d.extras||[];
 // v3: general notes. Older walkthroughs kept job-wide notes in job.notes; fold them in once.
 d.general=Object.assign({notes:'',dueDate:'',colors:'',tags:[]},d.general||{});
 if(!Array.isArray(d.general.tags)) d.general.tags=[];
 if(d.job.notes){d.general.notes=d.general.notes?d.general.notes+'\n'+d.job.notes:d.job.notes;d.job.notes=''}
 if(d.generalCollapsed==null) d.generalCollapsed=!!(d.rooms.length&&d.jobCollapsed);
}
function readIndex(){try{return JSON.parse(localStorage.getItem(K_INDEX))||{}}catch(e){return{}}}
function loadDoc(id){try{return JSON.parse(localStorage.getItem(K_PRE+id))}catch(e){return null}}
let S=null,lastSave=0,enterId=null;
function save(){
 S.updated=Date.now();
 try{
  localStorage.setItem(K_PRE+S.id,JSON.stringify(S));
  const ix=readIndex();
  ix[S.id]={id:S.id,customer:jobLabel(),address:'',date:S.job.date,rooms:S.rooms.length,updated:S.updated,uploadedAt:S.uploadedAt};
  localStorage.setItem(K_INDEX,JSON.stringify(ix)); localStorage.setItem(K_CUR,S.id);
  lastSave=S.updated; showSaved(true);
 }catch(e){toast('Could not save on this device ('+e.name+'). Export now.',6000)}
}
function showSaved(pulse){
 const el=$('#saved'); el.querySelector('span').textContent=lastSave?(navigator.onLine?'Saved':'Saved offline')+' · '+new Date(lastSave).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'Not saved yet';
 el.classList.toggle('off',!navigator.onLine);
 if(pulse){el.classList.add('pulse');clearTimeout(showSaved.t);showSaved.t=setTimeout(()=>el.classList.remove('pulse'),300)}
}
function openDoc(id){
 const d=id&&loadDoc(id);
 const raw=d&&JSON.stringify(d);
 S=d||blankWalkthrough(); migrate(S);
 if(!d||JSON.stringify(S)!==raw) save(); // new, or upgraded from an older version
 else{localStorage.setItem(K_CUR,S.id);lastSave=S.updated;showSaved()}
 render(); window.scrollTo(0,0);
}

/* ---------- helpers ---------- */
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function setP(o,p,v){const ks=p.split('.'),last=ks.pop();ks.reduce((a,k)=>(a[k]==null?(a[k]={}):a[k]),o)[last]=v}
function ctx(el){
 const r=el.closest('[data-room]'); if(r) return S.rooms.find(x=>x.id===r.dataset.room);
 const x=el.closest('[data-extra]'); if(x) return S.extras[+x.dataset.extra];
 if(el.closest('[data-scope=job]')) return S.job;
 if(el.closest('[data-scope=general]')) return S.general;
 return S;
}
const numify=v=>{const t=String(v).trim();if(t==='')return '';const n=Number(t);return isFinite(n)?n:v};
const roomById=id=>S.rooms.find(x=>x.id===id);
function derive(r){
 const n=v=>typeof v==='number'?v:NaN,L=n(r.length),W=n(r.width),H=n(r.height),out={};
 if(L>0&&W>0){out.floorSqft=+(L*W).toFixed(1);out.perimeterLnft=+(2*(L+W)).toFixed(1)}

  job:{address:(S.job.address||'').trim()||null,customerName:S.job.name||null,phone:S.job.phone||null,paintscoutEstimate:S.job.estimate||null,appointment:S.job.when||null,source:S.job.source==='link'?'link':'manual'},
  walkthrough:Object.assign({},rest,{rooms:S.rooms.map(r=>{const {collapsed,ui,...x}=r,c=JSON.parse(JSON.stringify(x));
   c.productSheen.bySurface=Object.fromEntries(Object.entries(c.productSheen.bySurface||{}).map(([k,o])=>[k,{product:(o.product||'').trim(),sheen:o.sheen||''}]).filter(([,o])=>o.product||o.sheen));
   return Object.assign(c,{productSheenEffective:psEffective(r),derived:derive(r)})})})};

 try{const file=new File([json],name,{type:'application/json'});

  ${PAINT.map(([k,l])=>`<div class="pl">${c(P[k],l)}</div>`).join('')}
  <div class="pl">${c(P.otherTrim,'Other trim')}</div>${(P.otherTrim?otFilled(r):[]).map(t=>`<div class="pl" style="padding-left:14px">${u(t.desc)} Ln Ft: ${u(t.lnft)}</div>`).join('')}
  ${(()=>{const E=psEffective(r),ks=Object.keys(E),d=roomDefault(r);return `<div class="ps" style="margin-top:8px">Product & sheen:</div>`+(ks.length?ks.map(k=>`<div class="pl">${esc(E[k].surface)}: ${u(psTxt(E[k]))}</div>`).join(''):`<div class="pl">Room: ${u(psTxt(d))}</div>`)})()}</div>
  <div style="padding-top:16px">${COUNTS.map(([k,l])=>`<div class="pl">${esc(l)}: ${k==='railingLnft'?'Ln Ft':'#'}${u(r.counts[k])}</div>`).join('')}</div></div>
 <div class="p2"><div>${c(r.ui.cabinets||CAB.some(([k])=>filled(r.cabinets[k])),'Cabinets')}${CAB.map(([k,l])=>`<div class="pl" style="padding-left:14px"># ${l}: ${esc(r.cabinets[k])}</div>`).join('')}</div><div><b>Additional Notes:</b>${note(r.notes)}</div></div></div>`};
 $('#print').innerHTML=jobPg+S.rooms.map(roomPg).join('');
}
function doPrint(){renderPrint();setTimeout(()=>window.print(),50)}
window.addEventListener('beforeprint',renderPrint);
/* TODO(upload): no backend yet. When one is chosen (e.g. a Google Apps Script web app writing to a
   Drive folder/Sheet, or a small HTTPS endpoint), set UPLOAD_ENDPOINT and POST exportPayload() there.
   The pendingUpload flag lets walkthroughs finished offline upload on the next 'online' event.
   Nothing leaves the device until this is wired up. */
const UPLOAD_ENDPOINT='';
async function uploadWalkthrough(payload){
 if(!UPLOAD_ENDPOINT) throw new Error('not-configured');
 const res=await fetch(UPLOAD_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
 if(!res.ok) throw new Error('HTTP '+res.status);
}
async function doUpload(){
 try{await uploadWalkthrough(exportPayload());S.uploadedAt=Date.now();S.pendingUpload=false;save();toast('Uploaded')}
 catch(e){if(e.message==='not-configured')toast("Upload isn't set up yet in this trial. Use Export for now.",4000);else{S.pendingUpload=true;save();toast("Offline. It'll upload when you're back online.")}}
}
window.addEventListener('online',()=>{showSaved();if(S&&S.pendingUpload&&UPLOAD_ENDPOINT)doUpload()});
window.addEventListener('offline',()=>showSaved());
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),ms)}

/* ---------- iOS: Add to Home Screen tip ---------- */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
function tipCard(){
 if(!isIOS||isStandalone()||localStorage.getItem('gv.tip.a2hs')) return '';
 return `<div class="tip" id="tip"><div style="flex:1"><b>Add this to your Home Screen</b>Tap Share <svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 8l5-5 5 5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> then “Add to Home Screen.” It works offline there, and Safari won't clear your walkthroughs.</div><button class="iconbtn" data-act="tipclose" aria-label="Dismiss">×</button></div>`;
}
/* ---------- iOS keyboard: hide the bottom bar and keep the field in view ---------- */
const editable=el=>el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['button','checkbox','radio','file'].includes(el.type)));
const touchy=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
function kbCheck(){
 const vv=window.visualViewport, typing=editable(document.activeElement);
 const kbUp=vv?(window.innerHeight-vv.height>120):false;
 document.body.classList.toggle('kb',typing&&(touchy||kbUp));
}
function keepInView(el){
 const vv=window.visualViewport; if(!el||!vv) return;
 const r=el.getBoundingClientRect(), top=vv.offsetTop+70, bottom=vv.offsetTop+vv.height-16;
 if(r.bottom>bottom||r.top<top) window.scrollBy({top:r.top-(top+(vv.height-70-r.height)/3),behavior:'smooth'});
}
document.addEventListener('focusin',e=>{ if(!editable(e.target)) return; kbCheck(); setTimeout(()=>{kbCheck();keepInView(e.target)},320) });
document.addEventListener('focusout',()=>setTimeout(kbCheck,60));
if(window.visualViewport){ visualViewport.addEventListener('resize',()=>{kbCheck(); if(editable(document.activeElement)) keepInView(document.activeElement)}) }

/* ---------- boot ---------- */
function linkFromUrl(first){
 const parse=str=>{const o={};(str||'').replace(/^[#?]/,'').split('&').forEach(kv=>{if(!kv)return;const i=kv.indexOf('='),k=decodeURIComponent((i<0?kv:kv.slice(0,i)).replace(/\+/g,' ')).trim().toLowerCase();let v='';try{v=decodeURIComponent((i<0?'':kv.slice(i+1)).replace(/\+/g,' '))}catch(e){v=i<0?'':kv.slice(i+1)}o[k]=v.trim()});return o};
 const q=parse(location.search),h=parse(location.hash),g=k=>(h[k]!=null&&h[k]!==''?h[k]:(q[k]||''));
 const j={address:g('address'),name:g('name'),phone:g('phone'),estimate:(g('estimate')||g('job')).replace(/^\s*#\s*/,'').trim(),when:g('when')};
 if(!j.address&&!j.estimate&&!j.name){if(first)openDoc(localStorage.getItem(K_CUR));return}
 history.replaceState(null,'',location.pathname);
 saveUpcoming(j);
 const docs=Object.values(readIndex()).map(m=>loadDoc(m.id)).filter(Boolean);
 const hit=docs.find(d=>d.job&&(j.estimate?d.job.estimate===j.estimate:(j.address&&(d.job.address||'').toLowerCase()===j.address.toLowerCase())));
 openDoc(hit?hit.id:null); applyJob(Object.assign({},S.job,Object.fromEntries(Object.entries(j).filter(([,v])=>v))),'link');
 toast('Linked to '+(j.address||'PaintScout #'+j.estimate))}
linkFromUrl(true); addEventListener('hashchange',()=>linkFromUrl(false));
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
